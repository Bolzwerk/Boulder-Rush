<title>Boulder Rush</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: full-screen canvas, HUD strip on top, touch controls floating over the lower screen, menus as overlays */
:root{
  --bg:#07060a; --panel:#15101c; --panel2:#201829; --ink:#f4e9c8; --dim:#a39579;
  --gold:#ffcc33; --gem:#5ee7ff; --red:#ff5d73; --green:#7bea6a; --line:#3b2f48;
  --pix:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --txt:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent}
body{font-family:var(--txt);font-size:20px}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:#000}
#scan{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,0) 4px);
  mix-blend-mode:multiply}
button{font:inherit;color:inherit}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(#000c,#0000);font-family:var(--pix);font-size:11px;pointer-events:none}
#hud .chip{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#0009;border:2px solid var(--line);white-space:nowrap}
#hud img{width:16px;height:16px;image-rendering:pixelated}
#hud .open{color:var(--green);border-color:var(--green)}
#hud .low{color:var(--red);border-color:var(--red)}
#hud .sp{flex:1}
#pauseBtn{pointer-events:auto;width:40px;height:34px;background:#0009;border:2px solid var(--line);font-family:var(--pix);font-size:11px;cursor:pointer}
#xpbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:11;background:#0008}
#xpbar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 6px var(--gold)}
#effects{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 50px);left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;font-family:var(--pix);font-size:9px;pointer-events:none}
#effects span{padding:4px 6px;background:#000a;border:2px solid currentColor}
/* Controls */
#ctl{position:fixed;inset:0;z-index:8;pointer-events:none}
#zone{position:absolute;bottom:0;width:58%;height:62%;pointer-events:auto;touch-action:none}
#ctl.left #zone{left:0} #ctl.right #zone{right:0}
#base{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
  border:3px solid #ffffff38;background:radial-gradient(#ffffff10,#ffffff06 60%,#0000 70%);pointer-events:none;opacity:.0;transition:opacity .12s}
#base.on{opacity:1}
#base.fixed{opacity:.75}
#base b{position:absolute;width:0;height:0;border:10px solid transparent;opacity:.45}
#base b.u{left:56px;top:6px;border-bottom:14px solid #fff;border-top:0}
#base b.d{left:56px;bottom:6px;border-top:14px solid #fff;border-bottom:0}
#base b.l{top:56px;left:6px;border-right:14px solid #fff;border-left:0}
#base b.r{top:56px;right:6px;border-left:14px solid #fff;border-right:0}
#base b.hot{opacity:1;filter:drop-shadow(0 0 4px var(--gold))}
#knob{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#ffcc3355;border:3px solid #ffcc33aa;pointer-events:none;opacity:0}
#knob.on{opacity:1}
#btns{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#ctl.left #btns{right:max(14px,env(safe-area-inset-right,0px))}
#ctl.right #btns{left:max(14px,env(safe-area-inset-left,0px))}
#pus{display:flex;flex-direction:column;gap:8px}
.pu{position:relative;width:52px;height:52px;border-radius:10px;background:#000a;border:2px solid #ffffff30;pointer-events:auto;touch-action:none;display:grid;place-items:center;padding:0}
.pu img{width:36px;height:36px;image-rendering:pixelated}
.pu .n{position:absolute;right:-4px;bottom:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#000;font-family:var(--pix);font-size:9px;display:grid;place-items:center;padding:0 3px}
.pu .lv{position:absolute;left:3px;top:2px;font-family:var(--pix);font-size:7px;color:var(--dim)}
.pu.off{opacity:.35}
.pu.off .n{background:#555;color:#ccc}
#grab{width:84px;height:84px;border-radius:50%;background:#000a;border:3px solid #ffffff40;pointer-events:auto;touch-action:none;font-family:var(--pix);font-size:9px;line-height:1.5}
#grab.on{background:#ffcc3340;border-color:var(--gold)}
@media (max-height:520px){ #pus{display:grid;grid-template-columns:repeat(2,42px)} .pu{width:42px;height:42px} .pu img{width:28px;height:28px} #pus{gap:5px} #grab{width:70px;height:70px} #btns{gap:6px} #zone{height:80%} }
/* Overlays */
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow-y:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 0%,#2a1d3acc,#07060af2 70%);box-sizing:border-box}
#ov.dim{background:#07060ad0}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--pix);font-size:clamp(26px,9vw,44px);line-height:1.15;text-align:center;color:var(--gold);
  text-shadow:3px 3px 0 #b5521b,6px 6px 0 #3a1608;letter-spacing:2px;margin:18px 0 4px}
.logo small{display:block;font-size:.32em;color:var(--gem);text-shadow:2px 2px 0 #0d4a6b;letter-spacing:4px;margin-top:10px}
h2{font-family:var(--pix);font-size:15px;color:var(--gold);margin:6px 0 0;text-align:center;line-height:1.4}
.card{background:var(--panel);border:3px solid var(--line);padding:12px 14px;box-shadow:4px 4px 0 #000}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.b{font-family:var(--pix);font-size:12px;line-height:1.4;padding:14px 12px;background:var(--panel2);border:3px solid var(--line);box-shadow:4px 4px 0 #000;cursor:pointer;text-align:center;flex:1;min-width:0}
.b:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.b:focus-visible,.pu:focus-visible,#grab:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
.b.main{background:#3a2a0a;border-color:var(--gold);color:var(--gold);font-size:15px;padding:18px 12px}
.b.small{font-size:10px;padding:10px 8px;flex:0 0 auto}
.b[disabled]{opacity:.4}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:9px;padding:3px 5px;margin-left:6px;vertical-align:middle}
.lvl{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.bar{height:12px;background:#000;border:2px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.bar.gem i{background:var(--gem)}
.muted{color:var(--dim)}
.help{font-size:19px;line-height:1.15;color:var(--dim)}
.help b{color:var(--ink);font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.world{font-family:var(--pix);font-size:13px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:3px solid var(--line);cursor:pointer;padding:0;max-width:100%}
.world .st{font-size:8px;color:var(--gold);letter-spacing:1px}
.world.lock{opacity:.3}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.br{display:flex;flex-direction:column;gap:14px;align-items:stretch;position:relative}
.br h3{font-family:var(--pix);font-size:9px;text-align:center;margin:0 0 2px;line-height:1.4}
.node{position:relative;background:var(--panel2);border:3px solid var(--line);padding:8px 4px;text-align:center;cursor:pointer;font-size:17px;line-height:1;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.node+.node::before{content:"";position:absolute;left:50%;top:-17px;width:3px;height:14px;background:var(--line);margin-left:-1.5px}
.node.have+.node.have::before{background:var(--c)}
.node.have{border-color:var(--c)}
.node.lock{opacity:.4}
.node.sel{outline:3px solid #fff;outline-offset:1px}
.pips{display:flex;gap:3px;justify-content:center}
.pips i{width:8px;height:8px;background:#000;border:1px solid var(--c)}
.pips i.f{background:var(--c)}
.detail{min-height:96px}
.detail .nm{font-family:var(--pix);font-size:12px;margin-bottom:6px;line-height:1.4}
.pucard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.pucard img{width:56px;height:56px;image-rendering:pixelated}
.pucard .nm{font-family:var(--pix);font-size:12px;margin-bottom:4px}
.pucard .bar{margin-top:6px;height:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed var(--line)}
.opt:last-child{border-bottom:0}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{font-family:var(--pix);font-size:9px;padding:8px 8px;background:#000;border:2px solid var(--line);cursor:pointer}
.seg button.on{border-color:var(--gold);color:var(--gold)}
.stat{display:flex;justify-content:space-between;font-family:var(--pix);font-size:11px;padding:6px 0}
.stars{font-family:var(--pix);font-size:28px;text-align:center;color:var(--gold);letter-spacing:8px}
.stars .no{color:#3b2f48}
#toasts{position:fixed;z-index:30;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{font-family:var(--pix);font-size:10px;line-height:1.5;background:#000d;border:2px solid var(--gold);color:var(--gold);padding:8px 12px;max-width:86vw;text-align:center;animation:tin .25s ease-out}
.toast.big{font-size:14px;border-width:3px;padding:12px 16px}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#banner{position:fixed;z-index:12;left:0;right:0;top:32%;text-align:center;font-family:var(--pix);pointer-events:none;color:var(--gold);text-shadow:3px 3px 0 #000;font-size:22px;line-height:1.6}
#banner.top{top:calc(env(safe-area-inset-top,0px) + 70px)}
#ctl.intro #btns{opacity:0;transition:opacity .3s}
#banner small{display:block;font-size:11px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="cv"></canvas>
<div id="scan"></div>
<div id="xpbar"><i></i></div>
<div id="hud" hidden>
  <div class="chip" id="hStage">W1</div>
  <div class="chip" id="hGems"><img id="gemIcon" alt=""><span>0/0</span></div>
  <div class="chip" id="hTime">0</div>
  <div class="sp"></div>
  <button id="pauseBtn" aria-label="Pause">II</button>
</div>
<div id="effects"></div>
<div id="ctl" class="left" hidden>
  <div id="zone"></div>
  <div id="base"><b class="u"></b><b class="r"></b><b class="d"></b><b class="l"></b></div>
  <div id="knob"></div>
  <div id="btns"><div id="pus"></div><button id="grab">GREI-<br>FEN</button></div>
</div>
<div id="banner" hidden></div>
<div id="toasts"></div>
<div id="ov"></div>

<script>
'use strict';
/* ================= basics ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TICK=135;
const E=0,D=1,W=2,S=3,R=4,G=5,X=6,F=7,B=8,P=9,EX=10,PL=11;
const DX=[0,1,0,-1],DY=[-1,0,1,0];

/* ================= content ================= */
const PU_IDS=['bomb','shield','freeze','magnet','drill'];
const PU={
  bomb:  {name:'Dynamit',  col:'#ff7a3d', eff:l=>`Sprengt ${BOMB_W[l-1]} breit und ${BOMB_D[l-1]} tief vor dir frei. Diamanten bleiben heil.`},
  shield:{name:'Schild',   col:'#5ee7ff', eff:l=>`${fmtS((4+2*l)*durMul())} unverwundbar. Gegner zerplatzen an dir.`},
  freeze:{name:'Zeitstopp',col:'#b9a6ff', eff:l=>`Felsen und Gegner frieren ${fmtS((3+1.5*l)*durMul())} lang ein.`},
  magnet:{name:'Magnet',   col:'#ff5d73', eff:l=>`Zieht ${fmtS((5+2*l)*durMul())} lang Diamanten im Umkreis ${1+l} an.`},
  drill: {name:'Bohrer',   col:'#ffcc33', eff:l=>`Gräbt ${fmtS((6+3*l)*durMul())} lang durch Ziegelmauern.`},
};
const BOMB_W=[3,3,5,5,7],BOMB_D=[3,5,5,7,7];
const SKILLS=[
  {id:'luck',   br:0,max:3,name:'Glücksgriff', d:r=>`${r*10}% Chance, dass ein Diamant doppelt zählt`},
  {id:'strong', br:0,max:1,name:'Kraftprotz',  d:()=>'Felsen bewegen sich beim ersten Schieben',req:'luck'},
  {id:'fingers',br:0,max:2,name:'Magnetfinger',d:r=>r<2?'Sammelt Diamanten direkt neben dir ein':'Sammelt auch diagonal ein',req:'strong'},
  {id:'hunter', br:0,max:3,name:'Schatzjäger', d:r=>`+${r*15}% XP aus allen Quellen`,req:'fingers'},
  {id:'time',   br:1,max:3,name:'Zeitgefühl',  d:r=>`+${r*15} Sekunden in jeder Welt`},
  {id:'helm',   br:1,max:2,name:'Grubenhelm',  d:r=>`Übersteht ${r} Felsentreffer pro Welt`,req:'time'},
  {id:'sense',  br:1,max:1,name:'Gefahrensinn',d:()=>'Markiert Felsen und Diamanten, die gleich fallen',req:'helm'},
  {id:'second', br:1,max:1,name:'Zweite Chance',d:()=>'Einmal pro Welt wird ein tödlicher Treffer zum Schild',req:'sense'},
  {id:'nose',   br:2,max:3,name:'Spürnase',    d:r=>`+${r} Power-up-Fund in jeder neuen Welt`},
  {id:'tinker', br:2,max:2,name:'Tüftler',     d:r=>`Aufwerten braucht ${r} Fragment${r>1?'e':''} weniger`,req:'nose'},
  {id:'endure', br:2,max:3,name:'Ausdauer',    d:r=>`Power-ups wirken ${r*20}% länger`,req:'tinker'},
  {id:'kit',    br:2,max:1,name:'Startpaket',  d:()=>'Jede neue Welt beginnt mit einer Zufallsladung',req:'endure'},
];
const BRANCHES=[['GRÄBER','#ffcc33'],['ÜBERLEBEN','#ff5d73'],['TECHNIK','#5ee7ff']];
const THEMES=[
  {name:'Lehmgrube',    bg:'#0b0705',dirt:['#6b3f1d','#84522a','#4a2810'],brick:['#a2563a','#c97a54','#4a2216'],rock:['#8a7d6b','#c4b7a0','#5a5044','#241f1a'],gem:['#5ee7ff','#d4fbff','#1d8fc2','#0b3a55']},
  {name:'Kristallhöhle',bg:'#05060d',dirt:['#2f3a6b','#435190','#1d244a'],brick:['#5c4a9a','#8370c8','#281e48'],rock:['#7c8496','#b8c0d2','#4d5363','#1e2129'],gem:['#ff6be0','#ffd6f7','#b0279a','#4f0b44']},
  {name:'Moosstollen',  bg:'#040805',dirt:['#2f5a24','#427a32','#1b3614'],brick:['#7a6a3a','#a3925a','#352d16'],rock:['#7d806a','#b8bca2','#4f523f','#1f2114'],gem:['#ffe14d','#fff7c8','#c49a12','#5a4204']},
  {name:'Magmaschacht', bg:'#0d0403',dirt:['#5a1e14','#80301e','#36110a'],brick:['#3a3a44','#5c5c72','#18181f'],rock:['#6a5f5c','#a39793','#433a38','#1b1716'],gem:['#7dff8a','#dcffe0','#24b23a','#0a4a15']},
  {name:'Eiskluft',     bg:'#03070b',dirt:['#6f8fa8','#94b5cc','#4c6a82'],brick:['#3d5a7a','#6385a8','#1c2c42'],rock:['#8a8fa0','#c9cfde','#5a5f70','#23262e'],gem:['#ff5d73','#ffd6dc','#c21f3a','#4f0815']},
];
const STEEL=['#6f7380','#a9aebb','#383b44'];
function fmtS(s){return (Math.round(s*10)/10).toString().replace('.',',')+' s'}

/* ================= save ================= */
const SAVE_KEY='boulderRush.save.v1';
function defSave(){return{v:1,t:0,xp:0,lvl:1,sp:0,skills:{},pu:Object.fromEntries(PU_IDS.map(id=>[id,{l:1,f:0,c:id==='bomb'?1:0}])),
  unlocked:1,stars:{},opts:{ctrl:'stick',side:'left',zoom:1,delay:true,sfx:2,mus:2,preview:true,haptic:true,scan:true},stats:{gems:0,deaths:0,kills:0,clears:0}}}
function fixSave(s){const d=defSave();if(!s||typeof s!=='object')return d;const o={...d,...s};
  o.opts={...d.opts,...(s.opts||{})};if(s.opts&&s.opts.sound===false&&s.opts.sfx===undefined){o.opts.sfx=0;o.opts.mus=0}delete o.opts.sound;o.stats={...d.stats,...(s.stats||{})};o.pu={};
  for(const id of PU_IDS)o.pu[id]={...d.pu[id],...((s.pu||{})[id]||{})};
  o.skills={...(s.skills||{})};o.stars={...(s.stars||{})};return o}
let save=defSave();
try{const raw=localStorage.getItem(SAVE_KEY);if(raw)save=fixSave(JSON.parse(raw))}catch(e){}
let dbDoc=null,dbBusy=false,dbDirty=false,dbTimer=0,cloudOK=false;
function persist(){save.t=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}
  dbDirty=true;clearTimeout(dbTimer);dbTimer=setTimeout(flushDb,1500)}
async function flushDb(){if(!dbDoc||!dbDirty||dbBusy)return;dbBusy=true;dbDirty=false;
  try{await dbDoc.set({t:save.t,json:JSON.stringify(save)})}catch(e){}
  dbBusy=false;if(dbDirty)flushDb()}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.collection('data/users/'+id).doc('save');
    const snap=await dbDoc.get();
    cloudOK=true;
    if(snap.exists){const d=snap.data();
      if(d&&typeof d.json==='string'&&(d.t||0)>(save.t||0)){
        save=fixSave(JSON.parse(d.json));try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}
        applyOpts();if(state==='menu')showMenu();toast('Spielstand aus der Cloud geladen');return}
    }
    if(save.t){dbDirty=true;flushDb()}
    if(state==='menu'&&screen==='opts')showOpts();
  }catch(e){}
}
const sk=id=>save.skills[id]||0;
const durMul=()=>1+0.2*sk('endure');
const needXP=l=>Math.round(80*Math.pow(l,1.35));
const fragNeed=l=>Math.max(1,l*2+1-sk('tinker'));
const maxCharges=l=>2+l;

/* ================= audio & haptics ================= */
const SFXV=[0,.5,1],MUSV=[0,.28,.55];
let ac=null,sfxBus=null,musBus=null;
function ensureAc(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();sfxBus=ac.createGain();musBus=ac.createGain();
    sfxBus.connect(ac.destination);musBus.connect(ac.destination);applyVol()}catch(e){ac=null;return null}}
  if(ac.state==='suspended'&&!document.hidden)ac.resume();return ac}
function au(){return save.opts.sfx?ensureAc():null}
function applyVol(){if(!ac)return;sfxBus.gain.value=SFXV[save.opts.sfx]||0;musBus.gain.value=(MUSV[save.opts.mus]||0)*(state==='pause'?.35:1)}
function osc(a,bus,f,t,dur,type,vol,slide=0){
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02)}
let noiseBuf=null;

      if(yy===y&&xx>=x&&xx<x+len){t[i]=E;L.pocket[i]=1}else if(t[i]!==W&&t[i]!==S&&t[i]!==X){t[i]=D;L.pocket[i]=yy===y-2?0:1}}

let DT=32,intro=null;
function camView(){const W2=cv.width,H2=cv.height,portrait=H2>W2*1.1;return{W2,H2,hudH:48*dpr,ctlH:portrait?H2*.34:0}}
function camTarget(px,py,z){const{W2,H2,hudH,ctlH}=camView(),ts=TS*z,viewH=H2-hudH-ctlH,mapW=lv.w*ts,mapH=lv.h*ts;
  let tx=(px+.5)*ts-W2/2,ty=(py+.5)*ts-hudH-viewH/2;
  tx=mapW<=W2?(mapW-W2)/2:clamp(tx,-ts*.5,mapW-W2+ts*.5);
  ty=mapH<=viewH?(mapH-viewH)/2-hudH:clamp(ty,-hudH-ts*.3,mapH-H2+ctlH+ts*.3);
  return[tx,ty]}
// Level preview: start at the exit, zoom out to the whole cave, hold, then fly in to the miner
function buildIntro(){const L=lv,w=L.w,{W2,H2,hudH,ctlH}=camView();
  const toC=(cam,z)=>[(cam[0]+W2/2)/(TS*z),(cam[1]+H2/2)/(TS*z),z];
  const availH=H2-hudH-ctlH*.35,zf=Math.min(1,W2*.96/(w*TS),availH*.94/(L.h*TS)),ts=TS*zf;
  const K0=toC(camTarget(L.exitI%w,(L.exitI/w)|0,1),1),K1=toC([(w*ts-W2)/2,(L.h*ts-availH)/2-hudH],zf),K2=toC(camTarget(L.pI%w,(L.pI/w)|0,1),1);
  intro={t:0,seg:[[K0,K0,.8],[K0,K1,1.1],[K1,K1,1.5],[K1,K2,1.1]],whoosh:[0,0,0,0]}}
const introLen=()=>intro.seg.reduce((a,s)=>a+s[2],0);
function introCam(){const{W2,H2}=camView();let t=intro.t,k=0;
  while(k<intro.seg.length-1&&t>intro.seg[k][2]){t-=intro.seg[k][2];k++}
  const [A,B,d]=intro.seg[k],e0=clamp(t/d,0,1),e=e0<.5?2*e0*e0:1-Math.pow(-2*e0+2,2)/2;
  if(A!==B&&!intro.whoosh[k]){intro.whoosh[k]=1;sfx.whoosh()}
  const z=Math.exp(Math.log(A[2])+(Math.log(B[2])-Math.log(A[2]))*e),cx=A[0]+(B[0]-A[0])*e,cy=A[1]+(B[1]-A[1])*e;
  return[cx*TS*z-W2/2,cy*TS*z-H2/2,z]}
function endIntro(){if(state!=='intro')return;intro.t=introLen();const c=introCam();camX=c[0];camY=c[1];camSnap=false;
  intro=null;state='play';acc=0;inp.q=[];sfx.start();$('#ctl').classList.remove('intro');$('#banner').classList.remove('top');banner('LOS!',700)}
function introMarkers(x0,x1,y0,y1,ts,now){const L=lv,w=L.w,pulse=.75+.25*Math.sin(now/160),r0=Math.max(ts*.8,7*dpr)*pulse;
  ctx.lineWidth=Math.max(2,2*dpr);ctx.textAlign='center';ctx.font=`${Math.round(8*dpr)}px "Press Start 2P", monospace`;
  const ring=(x,y,col,label)=>{const cx=(x+.5)*ts,cy=(y+.5)*ts;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(cx,cy,r0,0,6.283);ctx.stroke();
    if(label){ctx.fillStyle='#000';ctx.fillText(label,cx+dpr,cy-r0-5*dpr+dpr);ctx.fillStyle=col;ctx.fillText(label,cx,cy-r0-5*dpr)}};
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*w+x,tt=L.t[i];
    if(tt===X)ring(x,y,'#7bea6a','AUSGANG');else if(tt===P)ring(x,y,PU[PU_IDS[L.pu[i]]].col);else if(tt===F||tt===B)ring(x,y,'#ff5d73');else if(tt===PL)ring(x,y,'#ffcc33','DU')}}

function draw(now,dt){const W2=cv.width,H2=cv.height;ctx.fillStyle='#000';ctx.fillRect(0,0,W2,H2);
  if(!lv||!TH)return;const L=lv,w=L.w,a=(state==='play'||state==='dead')?clamp(acc/TICK,0,1):1;
  // camera
  const pi=L.pI;let ppx=pi%w,ppy=(pi/w)|0;
  if(L.mtick[pi]===L.tick&&L.mfrom[pi]>=0){const f=L.mfrom[pi];ppx=f%w+(ppx-f%w)*a;ppy=((f/w)|0)+(ppy-((f/w)|0))*a}
  let z=1;
  if(state==='intro'&&intro){const c=introCam();camX=c[0];camY=c[1];z=c[2]}
  else{const [tx,ty]=camTarget(ppx,ppy,1);
    if(camSnap){camX=tx;camY=ty;camSnap=false}else{const k=Math.min(1,dt*.01);camX+=(tx-camX)*k;camY+=(ty-camY)*k}}
  const ts=TS*z;DT=z===1?TS:Math.ceil(ts)+1;const mapW=w*ts,mapH=L.h*ts;
  shk*=.86;const sx=shk>.2?(Math.random()-.5)*shk*dpr*2:0,sy=shk>.2?(Math.random()-.5)*shk*dpr*2:0;
  const ox=Math.round(-camX+sx),oy=Math.round(-camY+sy);
  ctx.save();ctx.translate(ox,oy);ctx.fillStyle=TH.bg;ctx.fillRect(0,0,mapW,mapH);
  const x0=Math.max(0,Math.floor(camX/ts)-1),x1=Math.min(w-1,Math.floor((camX+W2)/ts)+1),y0=Math.max(0,Math.floor(camY/ts)-1),y1=Math.min(L.h-1,Math.floor((camY+H2)/ts)+1);
  const movers=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*w+x,tt=L.t[i];if(tt===E)continue;
    if(L.mtick[i]===L.tick&&L.mfrom[i]>=0&&tt!==EX){movers.push(i);continue}
    drawTile(tt,i,Math.round(x*ts),Math.round(y*ts),now,L)}
  for(const i of movers){const f=L.mfrom[i],fx=f%w,fy=(f/w)|0,x=i%w,y=(i/w)|0;drawTile(L.t[i],i,Math.round((fx+(x-fx)*a)*ts),Math.round((fy+(y-fy)*a)*ts),now,L)}
  if(sk('sense')&&Math.floor(now/250)%2){ctx.fillStyle='#ff3b4a';const q=Math.max(2,ts/8);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*w+x,tt=L.t[i];
      if((tt===R||tt===G)&&(L.t[i+w]===E||L.fall[i]||L.t[i+w]===PL)&&y<L.h-1){const X0=x*ts,Y0=y*ts;ctx.fillRect(X0,Y0,q,q);ctx.fillRect(X0+ts-q,Y0,q,q);ctx.fillRect(X0,Y0+ts-q,q,q);ctx.fillRect(X0+ts-q,Y0+ts-q,q,q)}}}
  if(state==='intro')introMarkers(x0,x1,y0,y1,ts,now);
  const sec=dt/1000,pp=ts/16;
  for(let k=parts.length-1;k>=0;k--){const q=parts[k];q.life-=sec;if(q.life<=0){parts.splice(k,1);continue}
    if(q.home){q.x+=(ppx+.5-q.x)*Math.min(1,sec*12);q.y+=(ppy+.5-q.y)*Math.min(1,sec*12)}else{q.vy+=9*sec;q.x+=q.vx*sec;q.y+=q.vy*sec}
    ctx.fillStyle=q.col;const s=Math.max(1,Math.round(q.s*pp*1.5));ctx.fillRect(Math.round(q.x*ts-s/2),Math.round(q.y*ts-s/2),s,s)}
  ctx.font=`${Math.round(7*pp)}px "Press Start 2P", monospace`;ctx.textAlign='center';
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.life-=sec;if(f.life<=0){floats.splice(k,1);continue}f.y-=sec*1.2;
    ctx.fillStyle='#000';ctx.fillText(f.txt,f.x*ts+pp,f.y*ts+pp);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x*ts,f.y*ts)}
  ctx.restore();
  if(L.freezeT>0){ctx.fillStyle='rgba(120,140,255,.14)';ctx.fillRect(0,0,W2,H2)}
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.35})`;ctx.fillRect(0,0,W2,H2);flash=Math.max(0,flash-sec*3)}

    <div class="row" style="justify-content:space-between;font-size:17px;margin-top:4px"><span>Ladungen ${s.c}/${maxCharges(s.l)}</span><span class="muted">${s.l<5?`Fragmente ${s.f}/${need}`:'Max. Stufe'}</span></div>
    <div class="bar gem"><i style="width:${s.l<5?s.f/need*100:100}%"></i></div></div></div>`}).join('')}
  <div class="card help">Im Spiel: Symbol rechts antippen oder Tasten 1–5. Dynamit zündet in Blickrichtung.</div>
  <button class="b" data-act="back">ZURÜCK</button></div>`;ov.scrollTop=0}
let resetArm=false;
function showOpts(){screen='opts';const o=save.opts;
  const seg=(key,vals)=>`<div class="seg">${vals.map(([v,l])=>`<button class="${o[key]===v?'on':''}" data-act="opt" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  ov.innerHTML=`<div class="wrap"><h2>OPTIONEN</h2><div class="card">
    <div class="opt"><span>Steuerung</span>${seg('ctrl',[['stick','Stick frei'],['dpad','Kreuz fest']])}</div>
    <div class="opt"><span>Steuerseite</span>${seg('side',[['left','Links'],['right','Rechts']])}</div>
    <div class="opt"><span>Kurz tippen = 1 Feld</span>${seg('delay',[[true,'An'],[false,'Aus']])}</div>
    <div class="opt"><span>Zoom</span>${seg('zoom',[[0,'Klein'],[1,'Mittel'],[2,'Groß']])}</div>
    <div class="opt"><span>Effekte</span>${seg('sfx',[[0,'Aus'],[1,'Leise'],[2,'Laut']])}</div>
    <div class="opt"><span>Musik</span>${seg('mus',[[0,'Aus'],[1,'Leise'],[2,'Laut']])}</div>
    <div class="opt"><span>Levelvorschau</span>${seg('preview',[[true,'An'],[false,'Aus']])}</div>
    <div class="opt"><span>Vibration</span>${seg('haptic',[[true,'An'],[false,'Aus']])}</div>
    <div class="opt"><span>Röhrenbild</span>${seg('scan',[[true,'An'],[false,'Aus']])}</div></div>
    <div class="card help">„Stick frei“: wo dein Daumen landet, ist die Mitte. „Kreuz fest“: das Steuerkreuz steht immer an derselben Stelle. „Kurz tippen = 1 Feld“ wartet nach dem ersten Schritt kurz, bevor du weiterläufst.</div>
    <div class="card help">Gespeichert wird ${cloudOK?'auf diesem Gerät und in deinem Claude-Konto, also auch auf anderen Geräten verfügbar':'auf diesem Gerät'}.<br>
    Stufe ${save.lvl} · ${save.stats.clears} Welten geschafft · ${save.stats.gems} Diamanten · ${save.stats.kills} Gegner · ${save.stats.deaths} Unfälle</div>
    <button class="b" data-act="reset" style="border-color:var(--red);color:var(--red)">${resetArm?'WIRKLICH ALLES LÖSCHEN?':'SPIELSTAND ZURÜCKSETZEN'}</button>
    <button class="b" data-act="back">ZURÜCK</button></div>`}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act;ensureAc();sfx.ui();
  if(act!=='reset')resetArm=false;
  switch(act){
    case 'play':{const n=+b.dataset.n;try{const de=document.documentElement;if(!document.fullscreenElement&&de.requestFullscreen&&matchMedia('(pointer:coarse)').matches)de.requestFullscreen().catch(()=>{})}catch(_){}startStage(n,true);break}
    case 'next':startStage(curStage+1,true);break;
    case 'worlds':showWorlds();break;
    case 'skills':showSkills();ov.scrollTop=0;break;
    case 'pus':showPUs();break;
    case 'opts':showOpts();ov.scrollTop=0;break;
    case 'menu':lv=null;showMenu();break;
    case 'back':showMenu();break;
    case 'resume':resumeGame();break;
    case 'restart':ov.hidden=true;startStage(curStage,false);break;
    case 'sel':selSkill=b.dataset.id;showSkills();break;
    case 'learn':{const s=SKILLS.find(x=>x.id===selSkill);if(canLearn(s)){save.skills[s.id]=sk(s.id)+1;save.sp--;persist();sfx.lvl();showSkills()}break}
    case 'opt':{const k=b.dataset.k;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(/^\d+$/.test(v))v=+v;save.opts[k]=v;persist();applyOpts();applyVol();if(k==='mus'||k==='sfx')ensureAc();showOpts();break}
    case 'reset':if(!resetArm){resetArm=true;showOpts()}else{resetArm=false;const o=save.opts;save=defSave();save.opts=o;persist();toast('Spielstand zurückgesetzt');showMenu()}break;
  }});

/* ================= Android app (Capacitor) ================= */
const NativeApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
if(NativeApp){NativeApp.addListener('backButton',()=>{
  if(state==='intro'){skipIntro();return}
  if(state==='play')pauseGame();else if(state==='pause')resumeGame();
  else if(state==='menu'&&screen==='title')NativeApp.exitApp();
  else if(state==='dead'||state==='clear'){lv=null;showMenu()}else showMenu()});
  NativeApp.addListener('pause',()=>{if(state==='play')pauseGame()})}

/* ================= boot ================= */
buildStatic();buildTheme(1);applyOpts();showMenu();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load)document.fonts.load('10px "Press Start 2P"').catch(()=>{});
setTimeout(initCloud,0);
window.__br={genLevel,get lv(){return lv},get p(){return p},get state(){return state},get save(){return save},startStage,physics,reach,tick,inp};
</script>
